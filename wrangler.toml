name = "shopscout-mcp"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
CURRENCY = "EUR"   # target currency for prices
LANGUAGE = "EN"
SHIP_TO = "DZ"     # ship-to country code
USD_PER_EUR = "1.08"  # converts Bundle deals US$ tier discounts to EUR (approximate)

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   AE_APP_KEY      – App Key from the Open Platform console
#   AE_APP_SECRET   – App Secret
#   AE_TRACKING_ID  – affiliate tracking id (optional, for affiliate links)
#   ACCESS_TOKEN    – long random string; becomes part of the connector URL
#   AE_COOKIES      – (experimental) logged-in AliExpress cookie header, for personalised prices

[[kv_namespaces]]
binding = "SHOPSCOUT_KV"   # refreshed session cookies, 15-min price cache, session status
id = "3ca7b8f9f09c4d7d8ec70d092f6b18a8"

[triggers]
crons = ["17 6 * * *"]     # daily session keep-alive (06:17 UTC)
